[build]
  publish = "public"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/fieldwork/products/zip-backpack/"
  to = "/fieldwork/products/canvas-daypack/"
  status = 301
  force = true
[[redirects]]
  from = "/fieldwork/products/*"
  to = "/fieldwork/products/canvas-daypack/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
